openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8088
  description: Generated server url
paths:
  /api/v1/notifications:
    get:
      tags:
      - notification-controller
      operationId: listForRecipient
      parameters:
      - name: recipientOrgId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
    post:
      tags:
      - notification-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NotificationResponse'
  /api/v1/notifications/{id}:
    get:
      tags:
      - notification-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NotificationResponse'
components:
  schemas:
    CreateNotificationRequest:
      required:
      - body
      - channel
      - subject
      type: object
      properties:
        recipientOrgId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - EMAIL
          - SMS
          - PUSH
          - IN_APP
        subject:
          type: string
        body:
          type: string
        sourceAgentRunId:
          type: string
          format: uuid
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        recipientOrgId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        channel:
          type: string
        subject:
          type: string
        body:
          type: string
        status:
          type: string
        sourceAgentRunId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
