openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082
  description: Generated server url
paths:
  /api/v1/users/me/become-volunteer:
    post:
      tags:
      - user-profile-controller
      operationId: becomeVolunteer
      responses:
        '200':
          description: OK
  /api/v1/auth/register:
    post:
      tags:
      - registration-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
  /api/v1/users/me:
    get:
      tags:
      - user-profile-controller
      operationId: me
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    patch:
      tags:
      - user-profile-controller
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
components:
  schemas:
    RegisterUserRequest:
      required:
      - displayName
      - email
      - password
      - tenantId
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        password:
          maxLength: 2147483647
          minLength: 8
          type: string
        displayName:
          type: string
        locale:
          type: string
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        phone:
          type: string
        displayName:
          type: string
        locale:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
        phone:
          type: string
        locale:
          type: string
