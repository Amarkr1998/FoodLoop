spring:
  application:
    name: trust
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodloop}?currentSchema=trust
    # Deliberately the unprivileged app role, not POSTGRES_USER — see
    # infrastructure/docker/postgres/init/01-schemas-and-extensions.sql;
    # POSTGRES_USER is a Postgres superuser and superusers bypass row-level
    # security entirely (ADR-009).
    username: ${POSTGRES_APP_USER:foodloop_app}
    password: ${POSTGRES_APP_PASSWORD:foodloop_app_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trust
  flyway:
    schemas: trust
    default-schema: trust
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # See api-gateway's application.yml for why jwk-set-uri, not
          # issuer-uri (this base file loads under every profile).
          jwk-set-uri: http://localhost:8081/realms/foodloop/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # See MatchEventPublisher (services/matching) / FoodEventPublisher
        # (services/food) — KafkaTemplate.send() blocks (up to this long)
        # and throws synchronously on first send if metadata can't be fetched.
        max.block.ms: 3000

foodloop:
  trust:
    # RiskCaseService's server-side (never agent-trusted) decision of
    # whether a risk case needs a human reviewer (spec §21, §26).
    human-review-threshold: ${TRUST_HUMAN_REVIEW_THRESHOLD:50}

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
