spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Not issuer-uri: that also enforces the token's `iss` claim
          # equals this exact string, but tokens obtained through the
          # browser-facing frontend (apps/web, via localhost:8081) carry
          # iss=http://localhost:8081/... while this internal Docker
          # hostname is the only address reachable from inside the
          # container. jwk-set-uri fetches signing keys directly and does
          # NOT add issuer-claim validation (Spring only adds that
          # validator when configured via issuer-uri) — signature
          # verification is still fully enforced, only the issuer-string
          # pin is dropped. Fine for this single-realm local dev setup;
          # revisit with an explicit multi-issuer validator before this
          # topology (frontend and backend reaching Keycloak by different
          # hostnames) is used anywhere beyond local dev.
          jwk-set-uri: http://keycloak:8080/realms/foodloop/protocol/openid-connect/certs
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://identity:8082
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: tenant
          uri: http://tenant:8083
          predicates:
            - Path=/api/v1/organizations/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: food
