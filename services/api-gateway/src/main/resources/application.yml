spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${FRONTEND_ORIGIN:http://localhost:3000}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: identity
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: tenant
          uri: ${TENANT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/organizations/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: food
          uri: ${FOOD_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/food-listings/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: pickup
          uri: ${PICKUP_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/pickups/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: ai-orchestration
          uri: ${AI_ORCHESTRATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: matching
          uri: ${MATCHING_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/matches/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: notification
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: impact
          uri: ${IMPACT_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/impact/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: ngo
          uri: ${NGO_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/v1/ngo/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
        - id: trust
          uri: ${TRUST_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/api/v1/trust/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"
      # /api/v1/tenants is deliberately not routed through the gateway —
      # it's a trusted-service-only endpoint (see Tenant's TenantController
      # Javadoc), never called by an end-user client.
      # Further routes are added here as each bounded-context service ships
      # (docs/architecture/08-phases-mvp-risks.md), not scaffolded ahead of
      # need per spec §63.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Not issuer-uri: see application-docker.yml's comment. This base
          # file is loaded even under the docker profile (Spring profiles
          # layer additively, they don't replace), so issuer-uri here was
          # silently re-enabling strict iss-claim matching regardless of
          # the docker profile's jwk-set-uri override — found live via a
          # "The iss claim is not valid" 401 despite the docker config
          # looking correct.
          jwk-set-uri: http://localhost:8081/realms/foodloop/protocol/openid-connect/certs
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:foodloop_dev_only}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
