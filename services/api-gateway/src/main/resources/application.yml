spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []
      # Routes are added here as each bounded-context service ships
      # (docs/architecture/08-phases-mvp-risks.md). Not scaffolded ahead of
      # need, per spec §63 — an empty route table with working edge
      # security/rate-limiting/tracing is Phase 1's actual deliverable.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodloop}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:foodloop_dev_only}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
