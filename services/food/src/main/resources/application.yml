spring:
  application:
    name: food
  datasource:
    # currentSchema replaces the whole search_path, not just prepends to it
    # — "food,public" is required (not just "food") so PostGIS's geography
    # type (installed in public) still resolves unqualified in migrations
    # and entity mappings.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodloop}?currentSchema=food,public
    # Deliberately the unprivileged app role, not POSTGRES_USER — see
    # infrastructure/docker/postgres/init/01-schemas-and-extensions.sql;
    # POSTGRES_USER is a Postgres superuser and superusers bypass row-level
    # security entirely (ADR-009).
    username: ${POSTGRES_APP_USER:foodloop_app}
    password: ${POSTGRES_APP_PASSWORD:foodloop_app_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: food
  flyway:
    schemas: food
    default-schema: food
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # See api-gateway's application.yml for why jwk-set-uri, not
          # issuer-uri (this base file loads under every profile).
          jwk-set-uri: http://localhost:8081/realms/foodloop/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # KafkaTemplate.send() blocks the caller (up to this long) fetching
        # topic metadata on first send, and throws synchronously if it
        # can't — default is 60s, which would make a Kafka outage stall or
        # fail donor-facing requests. Capped short so publish/claim fail
        # fast into FoodEventPublisher's catch instead (ADR-008).
        max.block.ms: 3000
        # Stamps a short, stable token in the __TypeId__ header instead of
        # this service's own class's fully-qualified name — Pickup consumes
        # this topic and needs to resolve it to *its own* differently-
        # packaged copy of the event class (see pickup's consumer config
        # and FoodClaimedEvent's Javadoc on the pickup side).
        spring.json.type.mapping: "food.claimed:com.foodloop.food.infrastructure.events.FoodClaimedEvent"
    consumer:
      group-id: food-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.foodloop.food.infrastructure.events
        # Must match the tokens Pickup's producer stamps for these two
        # event types (see pickup's producer config) — resolves each to
        # this service's own copy of the class rather than Pickup's, which
        # isn't on this classpath.
        spring.json.type.mapping: "pickup.completed:com.foodloop.food.infrastructure.events.PickupCompletedEvent,pickup.no_show:com.foodloop.food.infrastructure.events.PickupNoShowEvent"

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
