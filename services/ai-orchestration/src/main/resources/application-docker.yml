spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/foodloop?currentSchema=ai,public
  security:
    oauth2:
      resourceserver:
        jwt:
          # See api-gateway's application-docker.yml for why jwk-set-uri
          # (not issuer-uri): decouples internal key-fetch reachability
          # from the browser-facing frontend's different-hostname iss claim.
          jwk-set-uri: http://keycloak:8080/realms/foodloop/protocol/openid-connect/certs

foodloop:
  services:
    food:
      base-url: http://food:8084
    matching:
      base-url: http://matching:8087
    tenant:
      base-url: http://tenant:8083
    notification:
      base-url: http://notification:8088
    ngo:
      base-url: http://ngo:8090
    trust:
      base-url: http://trust:8091
    pickup:
      base-url: http://pickup:8085
  service-account:
    token-uri: http://keycloak:8080/realms/foodloop/protocol/openid-connect/token
