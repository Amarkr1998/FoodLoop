spring:
  application:
    name: ai-orchestration
  datasource:
    # No PostGIS types are used in the ai schema, but ",public" is kept for
    # consistency with every other service's currentSchema config — see
    # services/food's application.yml for the failure mode this avoids.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodloop}?currentSchema=ai,public
    # Deliberately the unprivileged app role, not POSTGRES_USER — see
    # infrastructure/docker/postgres/init/01-schemas-and-extensions.sql;
    # POSTGRES_USER is a Postgres superuser and superusers bypass row-level
    # security entirely (ADR-009).
    username: ${POSTGRES_APP_USER:foodloop_app}
    password: ${POSTGRES_APP_PASSWORD:foodloop_app_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai
  flyway:
    schemas: ai
    default-schema: ai
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodloop}
  ai:
    azure:
      openai:
        # Placeholder defaults, not blank: Spring AI's OpenAiClientBuilder
        # bean is built eagerly at context-refresh time regardless of
        # whether anything ever calls it, and throws if the endpoint is
        # empty. AzureOpenAiChatModelProvider.isAvailable() reads the raw
        # AZURE_OPENAI_* env vars directly (genuinely blank when unset) to
        # decide whether to actually use this bean, so the provider chain
        # still correctly degrades to MockChatModelProvider in local dev
        # (AI_PROVIDER_MODE=mock in .env.example) — these placeholders exist
        # only to keep bean construction from crashing, never to make the
        # provider look configured.
        api-key: ${AZURE_OPENAI_API_KEY:not-configured}
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://not-configured.invalid/}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o}

foodloop:
  services:
    food:
      base-url: ${FOOD_SERVICE_URI:http://localhost:8084}
    matching:
      base-url: ${MATCHING_SERVICE_URI:http://localhost:8087}
    tenant:
      base-url: ${TENANT_SERVICE_URI:http://localhost:8083}
    notification:
      base-url: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
  rescue:
    # RescueScheduler's sweep cadence and the two expiry checkpoints (spec
    # §18's "e.g., T-4h, T-1h"), plus the deterministic candidate-search
    # policy: wider radius and human-ops escalation once inside the final
    # window. All configurable per environment, not hardcoded in code.
    sweep-interval-ms: ${RESCUE_SWEEP_INTERVAL_MS:300000}
    threshold-minutes-4h: ${RESCUE_THRESHOLD_MINUTES_4H:240}
    threshold-minutes-1h: ${RESCUE_THRESHOLD_MINUTES_1H:60}
    notify-top-n: ${RESCUE_NOTIFY_TOP_N:3}
    radius-km-4h: ${RESCUE_RADIUS_KM_4H:10}
    radius-km-1h: ${RESCUE_RADIUS_KM_1H:25}
  service-account:
    # This service's own Keycloak client-credentials identity (see
    # infrastructure/docker/keycloak/foodloop-realm.json's
    # foodloop-ai-orchestration client) — used to call other bounded-context
    # services' APIs as a scoped, audited tool call
    # (docs/architecture/05-ai-agent-architecture.md §1), never with a
    # donor/receiver's own token.
    client-id: foodloop-ai-orchestration
    client-secret: ${KEYCLOAK_AI_ORCHESTRATION_CLIENT_SECRET:dev-only-ai-orch-secret-change-me}
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/foodloop/protocol/openid-connect/token}

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
