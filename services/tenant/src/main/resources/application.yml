spring:
  application:
    name: tenant
  datasource:
    # "tenant,public" — currentSchema replaces the whole search_path rather
    # than prepending to it; PostGIS's geography type (installed in public)
    # needs to stay resolvable now that organization.location uses it. See
    # services/food's application.yml for the failure mode this avoids.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodloop}?currentSchema=tenant,public
    # Deliberately the unprivileged app role, not POSTGRES_USER — see
    # infrastructure/docker/postgres/init/01-schemas-and-extensions.sql;
    # POSTGRES_USER is a Postgres superuser and superusers bypass row-level
    # security entirely (ADR-009).
    username: ${POSTGRES_APP_USER:foodloop_app}
    password: ${POSTGRES_APP_PASSWORD:foodloop_app_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tenant
  flyway:
    schemas: tenant
    default-schema: tenant
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodloop}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # See OrganizationEventPublisher — KafkaTemplate.send() blocks (up
        # to this long) and throws synchronously on first send if metadata
        # can't be fetched; capped short so organization creation fails
        # fast into the publisher's catch instead of stalling for the 60s
        # default.
        max.block.ms: 3000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
