name: foodloop

x-env: &default-env
  env_file:
    - ../../.env

services:
  # ---------------------------------------------------------------------
  # Data plane
  # ---------------------------------------------------------------------
  postgres:
    build:
      context: ./postgres
    container_name: foodloop-postgres
    <<: *default-env
    environment:
      POSTGRES_DB: foodloop
      POSTGRES_USER: ${POSTGRES_USER:-foodloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodloop_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodloop} -d foodloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodloop-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-foodloop_dev_only}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-foodloop_dev_only}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Event / message plane (ADR-002: Kafka = durable domain events,
  # RabbitMQ = operational work queues)
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: foodloop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "ZmZmZmZmZmZmZmZmZmZmZm"
    healthcheck:
      # A raw TCP probe, not kafka-broker-api-versions.sh: that script
      # launches its own fresh JVM per invocation, which measured 20-30s+
      # wall time under this VM's contention (9+ app-service JVMs booting
      # concurrently) even though the broker itself was idle and
      # responded instantly once connected — bumping the timeout from
      # 10s to 30s still wasn't enough (a later run hit the 30s cap too).
      # A bash /dev/tcp check has no JVM startup cost of its own, so it
      # reflects the broker's actual readiness instead of CPU scheduling
      # luck.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      # See keycloak's start_period comment — same resource-contention
      # timing issue: the broker was actually up and responsive well
      # before the bare retries*interval window without this, verified
      # by running the healthcheck command manually against a "unhealthy"
      # container and finding it succeeded.
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: foodloop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-foodloop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-foodloop_dev_only}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Not rabbitmq-diagnostics ping: it spins up its own separate
      # Erlang VM per invocation to connect via distributed Erlang, which
      # measured timing out under this VM's CPU contention (same root
      # cause as kafka's healthcheck, fixed the same way) even though the
      # broker itself started fine and was listening on 5672 the whole
      # time. A bash TCP probe has no per-check VM startup cost.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5672'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Identity plane
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: foodloop-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      # No fixed KC_HOSTNAME here deliberately: an earlier attempt pinned
      # this to http://keycloak:8080 so every token's iss claim matched
      # what backend services expected, but that broke browser-facing auth
      # (apps/web) — the browser can't resolve the internal Docker hostname
      # `keycloak`, so login redirects 404'd. Backend services no longer
      # need a fixed issuer anyway: their resourceserver.jwt config uses
      # jwk-set-uri (see each service's application-docker.yml) to fetch
      # signing keys from a hardcoded internally-reachable URL directly,
      # independent of whatever iss string a token carries. With that in
      # place, leaving hostname unpinned is correct: Keycloak just echoes
      # back whatever Host header each request actually used (localhost:8081
      # for the browser/host-run Next.js, keycloak:8080 for anything
      # internal that still does discovery), and nothing depends on those
      # being the same value.
    ports:
      - "8081:8080"
    volumes:
      # Without this, Keycloak's embedded database (signing keys, active
      # sessions, refresh tokens, and any user registered at runtime) lives
      # only in the container's writable layer — every recreate (a plain
      # `docker compose up -d` picking up an unrelated config change is
      # enough, not just an explicit rebuild) silently invalidates every
      # existing browser session with no error until the next request,
      # and wipes every registered user. This volume is what makes
      # Keycloak survive restarts like every other stateful service here
      # already does (postgres, redis, etc.). --import-realm below is
      # still safe with this in place: Keycloak skips importing a realm
      # that already exists in its database, so it only actually seeds
      # anything on a genuinely fresh volume.
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/foodloop-realm.json:/opt/keycloak/data/import/foodloop-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Keycloak's start-dev + realm import routinely takes well over the
      # bare retries*interval window (~100s) on a resource-constrained
      # dev machine — start_period keeps early failures from counting
      # against the retry budget before it's had a real chance to come up.
      # Bumped from 90s once a persistent volume was added for Keycloak's
      # own database (see the keycloak_data volume comment above): the
      # first-ever Liquibase schema migration against a fresh persistent
      # store is measurably slower than the previous ephemeral/ad-hoc
      # startup path, confirmed live by watching it still mid-migration
      # well past the old 190s total budget.
      start_period: 300s

  # ---------------------------------------------------------------------
  # Observability foundation (optional locally: `docker compose --profile observability up -d`)
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: foodloop-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: foodloop-prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: foodloop-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_only}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  # ---------------------------------------------------------------------
  # Application plane
  # ---------------------------------------------------------------------
  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    container_name: foodloop-identity
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      # This dev VM has ~3.8GB total for the whole stack; with 9+ app
      # JVMs booting concurrently, a single service's Flyway+Hibernate
      # bootstrap alone was measured taking 6+ minutes (vs. the prior
      # 190s budget) — see keycloak/kafka's start_period comments for
      # the same root cause.
      start_period: 480s

  tenant:
    build:
      context: ../..
      dockerfile: services/tenant/Dockerfile
    container_name: foodloop-tenant
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  food:
    build:
      context: ../..
      dockerfile: services/food/Dockerfile
    container_name: foodloop-food
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  pickup:
    build:
      context: ../..
      dockerfile: services/pickup/Dockerfile
    container_name: foodloop-pickup
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  ai-orchestration:
    build:
      context: ../..
      dockerfile: services/ai-orchestration/Dockerfile
    container_name: foodloop-ai-orchestration
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # `:-` (unset-OR-empty), not `:` (unset-only): .env.example ships
      # these as present-but-empty, and Spring's own `${VAR:default}`
      # placeholder syntax only falls back when a property is absent, not
      # when it resolves to "" — so an empty env var here would otherwise
      # reach AzureOpenAiClientBuilderConfiguration as an empty endpoint
      # string and crash bean creation at startup (Assert.hasText). Compose
      # resolves this substitution before the container ever sees these
      # vars, so the container's env is never blank.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://not-configured.invalid/}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-not-configured}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  matching:
    build:
      context: ../..
      dockerfile: services/matching/Dockerfile
    container_name: foodloop-matching
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      food:
        condition: service_healthy
      tenant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  notification:
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    container_name: foodloop-notification
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  impact:
    build:
      context: ../..
      dockerfile: services/impact/Dockerfile
    container_name: foodloop-impact
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      food:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  ngo:
    build:
      context: ../..
      dockerfile: services/ngo/Dockerfile
    container_name: foodloop-ngo
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  trust:
    build:
      context: ../..
      dockerfile: services/trust/Dockerfile
    container_name: foodloop-trust
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 480s

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: foodloop-api-gateway
    <<: *default-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/foodloop
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
      tenant:
        condition: service_healthy
      food:
        condition: service_healthy
      pickup:
        condition: service_healthy
      ai-orchestration:
        condition: service_healthy
      matching:
        condition: service_healthy
      notification:
        condition: service_healthy
      impact:
        condition: service_healthy
      ngo:
        condition: service_healthy
      trust:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  grafana_data:
  keycloak_data:
