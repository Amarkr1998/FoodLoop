name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Static analysis
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:check
        continue-on-error: true # tightened once modules exist beyond api-gateway

      - name: Unit tests
        run: mvn -B -ntp test

      - name: Dependency scan
        run: mvn -B -ntp org.owasp:dependency-check-maven:check
        continue-on-error: true # advisory until a suppression baseline is established

  # AI evaluation tests, container build/scan, and deploy stages are added as
  # ai/evaluators and each service's Dockerfile land (docs/architecture/07-infrastructure-deployment.md, §48).
